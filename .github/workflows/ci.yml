# CI — run the bulletproof test suite on every push/PR
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check the inline script
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('caveman-writer-studio.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);fs.writeFileSync('/tmp/app.js',m[1]);"
          node --check /tmp/app.js
      - name: Run bulletproof test suite (74 checks · 5 angles)
        run: node tests/bullet.js
